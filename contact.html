<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact — 10xGrow</title>
  <meta name="description" content="Get in touch with 10xGrow. Contact us for consulting services or to learn more about Call AI Agent." />
  <link rel="stylesheet" href="styles.css" />
  <script defer src="script.js"></script>
  <style>
    .contact-hero {
      padding: 60px 0 40px;
    }
    
    .contact-hero h1 {
      margin-bottom: 1rem;
    }
    
    .intro {
      font-size: 1.1rem;
      margin-bottom: 2rem;
      color: var(--muted);
    }
    
    .form-block {
      background-color: var(--surface);
      border: 1px solid var(--muted-border);
      border-radius: 10px;
      padding: 2rem;
      margin-bottom: 2rem;
      max-width: 600px;
    }
    
    .form-group {
      margin-bottom: 1.5rem;
    }
    
    .form-group label {
      display: block;
      margin-bottom: 0.5rem;
      color: var(--text);
      font-weight: 500;
    }
    
    .form-group input[type="text"],
    .form-group input[type="email"],
    .form-group textarea {
      width: 100%;
      padding: 0.75rem;
      background-color: var(--bg);
      border: 1px solid var(--muted-border);
      border-radius: 6px;
      color: var(--text);
      font-size: 1rem;
      font-family: inherit;
    }
    
    .form-group input[type="text"]:focus,
    .form-group input[type="email"]:focus,
    .form-group textarea:focus {
      outline: none;
      border-color: var(--brand);
    }
    
    .form-group textarea {
      resize: vertical;
      min-height: 120px;
    }
    
    .success-message {
      display: none;
      background-color: #064e3b;
      border: 1px solid #059669;
      color: #6ee7b7;
      padding: 1rem;
      border-radius: 6px;
      margin-top: 1rem;
    }
    
    .success-message.show {
      display: block;
    }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="index.html">10xGrow</a>
      <nav class="nav" id="main-nav">
        <a href="index.html">Home</a>
        <a href="product.html">Product</a>
        <a href="consulting.html">Consulting</a>
        <a href="contact.html" aria-current="page">Contact</a>
      </nav>
      <button id="nav-toggle" aria-label="Toggle menu" class="nav-toggle">☰</button>
    </div>
  </header>

  <main>
    <section class="contact-hero container">
      <h1>Contact Us</h1>
      <p class="intro">Get in touch with our team. We'll respond within one business day.</p>
      
      <div class="form-block">
        <form id="contact-form">
          <div class="form-group">
            <label for="name">Name</label>
            <input type="text" id="name" name="name" required placeholder="Your name">
          </div>
          
          <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" required placeholder="your@email.com">
          </div>
          
          <div class="form-group">
            <label for="message">Message</label>
            <textarea id="message" name="message" required placeholder="How can we help you?"></textarea>
          </div>
          
          <button type="submit" class="btn btn-primary">Send Message</button>
          
          <div id="contact-form-msg" class="success-message">
            Thank you! Your message has been sent successfully.
          </div>
        </form>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <div class="brand-col">
        <a class="brand" href="index.html">10xGrow</a>
        <p>Business consulting and AI solutions for startups and growth teams.</p>
      </div>

      <div class="links-col">
        <a href="product.html">Product</a>
        <a href="consulting.html">Consulting</a>
        <a href="contact.html">Contact</a>
      </div>

      <div class="contact-col">
        <a href="mailto:info@10xgrow.ai">info@10xgrow.ai</a>
      </div>
    </div>
  </footer>
</body>
</html>
