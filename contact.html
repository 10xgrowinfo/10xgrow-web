<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact - 10xGrow Preview</title>
  <style>
    /* Dark theme preview styles with light-grey blocks */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background-color: #071026;
      color: #e6eef8;
      line-height: 1.6;
      padding: 20px;
    }
    
    .container {
      max-width: 800px;
      margin: 0 auto;
    }
    
    h1 {
      font-size: 2.5rem;
      margin-bottom: 1rem;
      color: #60a5fa;
    }
    
    .intro {
      font-size: 1.1rem;
      margin-bottom: 2rem;
      color: #94a3b8;
    }
    
    .form-block {
      background-color: #1e293b;
      border: 1px solid #334155;
      border-radius: 10px;
      padding: 2rem;
      margin-bottom: 2rem;
    }
    
    .form-group {
      margin-bottom: 1.5rem;
    }
    
    label {
      display: block;
      margin-bottom: 0.5rem;
      color: #e6eef8;
      font-weight: 500;
    }
    
    input[type="text"],
    input[type="email"],
    textarea {
      width: 100%;
      padding: 0.75rem;
      background-color: #0f172a;
      border: 1px solid #334155;
      border-radius: 6px;
      color: #e6eef8;
      font-size: 1rem;
      font-family: inherit;
    }
    
    input[type="text"]:focus,
    input[type="email"]:focus,
    textarea:focus {
      outline: none;
      border-color: #60a5fa;
    }
    
    textarea {
      resize: vertical;
      min-height: 120px;
    }
    
    button {
      background-color: #60a5fa;
      color: #fff;
      padding: 0.75rem 2rem;
      border: none;
      border-radius: 6px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s;
    }
    
    button:hover {
      background-color: #3b82f6;
    }
    
    .success-message {
      display: none;
      background-color: #064e3b;
      border: 1px solid #059669;
      color: #6ee7b7;
      padding: 1rem;
      border-radius: 6px;
      margin-top: 1rem;
    }
    
    .success-message.show {
      display: block;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Contact Us</h1>
    <p class="intro">Get in touch with our team. We'll respond within one business day.</p>
    
    <div class="form-block">
      <form id="contactForm">
        <div class="form-group">
          <label for="name">Name</label>
          <input type="text" id="name" name="name" required placeholder="Your name">
        </div>
        
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" required placeholder="your@email.com">
        </div>
        
        <div class="form-group">
          <label for="message">Message</label>
          <textarea id="message" name="message" required placeholder="How can we help you?"></textarea>
        </div>
        
        <button type="submit">Send Message</button>
        
        <div id="successMessage" class="success-message">
          Thank you! Your message has been sent successfully.
        </div>
      </form>
    </div>
  </div>
  
  <script>
    // Minimal JS to show success message on submit
    document.getElementById('contactForm').addEventListener('submit', function(e) {
      e.preventDefault();
      
      // Show success message
      const successMessage = document.getElementById('successMessage');
      successMessage.classList.add('show');
      
      // Reset form
      this.reset();
      
      // Hide message after 5 seconds
      setTimeout(function() {
        successMessage.classList.remove('show');
      }, 5000);
    });
  </script>
</body>
</html>
